name: lembur
description: KerjaKu PTC, aplikasi offline untuk pencatatan lembur dan administrasi pekerja PTC.
publish_to: 'none'
version: 1.10.0+21

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  go_router: 17.0.0
  provider: 6.1.5
  sqflite: 2.4.2
  path: 1.9.1
  path_provider: 2.1.5
  shared_preferences: 2.5.3
  intl: 0.20.2
  uuid: 4.5.1
  pdf: 3.11.3
  printing: 5.14.2
  excel: 4.0.6
  share_plus: 11.1.0

dev_dependencies:
  sqflite_common_ffi: 2.3.6
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/logos/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: '#2864DC'
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png
  adaptive_icon_foreground_inset: 20
